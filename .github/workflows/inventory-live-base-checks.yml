name: Inventory live-base validation
on:
  push:
    branches: [feat/inventory-iteration-2-live-base]
  pull_request:
    branches: [inventory-manager]
    paths:
      - 'dist/inventory*'
      - 'tests/inventory*'
      - 'tests/save-home.cjs'
      - '.github/workflows/inventory-live-base-checks.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and engine regression suites
        run: |
          node --check dist/inventory.js
          node --check dist/inventory-engine.js
          node tests/inventory.test.cjs
          node tests/inventory-planning.test.cjs
          node tests/inventory-setup.test.cjs
          node tests/inventory-live-iteration2.test.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/rise-browser --no-save --package-lock=false playwright@1.57.0
          google-chrome --version
          mkdir -p /tmp/rise-live-shots
      - name: Browser regressions against the current stockroom
        env:
          PLAYWRIGHT_MODULE: /tmp/rise-browser/node_modules/playwright
          PLAYWRIGHT_PATH: /tmp/rise-browser/node_modules/playwright
          CHROME_PATH: /usr/bin/google-chrome
          SCREENSHOTS: /tmp/rise-live-shots
        run: |
          for file in tests/inventory-live-iteration2.browser.cjs tests/inventory-planning.browser.cjs tests/inventory-setup.browser.cjs tests/inventory-shelves.browser.cjs tests/inventory-presentation.browser.cjs tests/inventory-tutorial.browser.cjs tests/save-home.cjs; do
            node "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-base-browser-review
          path: /tmp/rise-live-shots
          retention-days: 7
  unchanged-floor-baseline:
    # These legacy suites also fail on the verified production baseline.
    # Keep their status visible without changing Floor Manager for this task.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report existing Floor Manager checks
        continue-on-error: true
        run: |
          failed=0
          for file in tests/floor-manager/*checks.mjs; do
            echo "===== $file"
            if timeout --kill-after=3 30 node "$file"; then echo "PASS $file"; else echo "FAIL or timeout $file"; failed=1; fi
          done
          exit "$failed"
